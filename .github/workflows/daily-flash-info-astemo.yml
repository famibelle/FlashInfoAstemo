name: Daily Flash Info Generation

on:
  schedule:
    # Exécute tous les matins à 3h00 UTC (5h00 heure de Paris en été, 4h00 en hiver)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Permet de déclencher manuellement
    inputs:
      date:
        description: 'Date pour les infos (format YYYY-MM-DD). La date du jour si omis.'
        required: false
        default: ''
      edition:
        description: 'Édition à générer'
        required: false
        type: choice
        default: 'matin'
        options:
          - matin
          - midi
          - soir

jobs:
  generate-flash-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    concurrency:
      group: flash-info-generator
      cancel-in-progress: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
          
      - name: Create audio directory
        run: mkdir -p docs/audio
           
      - name: Cleanup temp files
        run: |
          rm -f /tmp/flash_info_output/_seg_*.mp3 /tmp/flash_info_output/_seg_*_p.mp3 2>/dev/null || true

      - name: Verify environment
        run: |
          echo "✅ Vérification de l'environnement..."
          [ -n "${{ secrets.MISTRAL_API_KEY_ASTEMO }}" ] || { echo "❌ MISTRAL_API_KEY_ASTEMO manquant"; exit 1; }
          command -v ffmpeg >/dev/null 2>&1 || { echo "❌ ffmpeg non installé"; exit 1; }
          command -v ffprobe >/dev/null 2>&1 || { echo "❌ ffprobe non installé"; exit 1; }
          echo "✅ Environnement valide"
          
      - name: Generate Flash Info MP3
        env:
          MISTRAL_API_KEY_ASTEMO: ${{ secrets.MISTRAL_API_KEY_ASTEMO }}
        run: |
          # Utiliser la date fournie ou la date du jour
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            DATE=$(date -d "$INPUT_DATE" +'%Y%m%d')
            DATE_ARG="--date $INPUT_DATE"
          else
            DATE=$(date +'%Y%m%d')
            DATE_ARG=""
          fi
          EDITION="${{ github.event.inputs.edition || 'matin' }}"
          OUTPUT_FILE="docs/audio/flash-info-astemo-${DATE}-${EDITION}.mp3"
          python flash-info-astemo.py --edition "$EDITION" --output "$OUTPUT_FILE" --verbose $DATE_ARG
          echo "EDITION=${EDITION}" >> $GITHUB_ENV
          echo "DATE=${DATE}" >> $GITHUB_ENV
           
      - name: Generate and push
        run: |
          # Générer le RSS (regénère tout le flux)
          python scripts/update_rss.py
          
          # Commit tout d'un coup
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add .
            git commit -m "🎙️ Flash Info ${DATE} - ${EDITION}"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
