<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Madelaine — L'actualité du Freinage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .artwork {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .tagline {
      font-size: 0.95rem;
      color: #8b8fa8;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #252836;
      border: 1px solid #333646;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: #e8e8e8;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 0.75rem;
    }

    .btn:hover {
      background: #2e3245;
      border-color: #4a4f6a;
    }

    .btn-icon { font-size: 1.4rem; flex-shrink: 0; }
    .btn-text { text-align: left; }
    .btn-label { display: block; color: #fff; }
    .btn-sub { display: block; font-size: 0.8rem; color: #8b8fa8; margin-top: 2px; }
    .btn-arrow { margin-left: auto; color: #555; font-size: 0.9rem; }

    .divider {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 1.5rem 0;
    }

    .apple-embed {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 0.75rem;
      display: block;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #555;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .rss-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #f26522;
      font-size: 0.82rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    .rss-link:hover { opacity: 0.75; }

    .rss-icon { width: 16px; height: 16px; flex-shrink: 0; }

    .badge {
      display: inline-block;
      background: #1e3a2f;
      color: #4ade80;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    /* Share buttons */
    .share-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #252836;
      border: 1px solid #333646;
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      color: #b0b4cc;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .share-btn:hover {
      background: #2e3245;
      color: #e8e8e8;
      border-color: #444;
    }
    .share-btn:active { transform: scale(0.95); }
    .share-icon { font-size: 1rem; flex-shrink: 0; }
    .share-text {
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="artwork.jpg" alt="Madelaine — L'actualité du Freinage" class="artwork">
    <h1>Madelaine</h1>
    <p class="tagline">L'actualité du Freinage — Freinage et mobilité<br>Matin, midi et soir — par Madelaine</p>

    <hr class="divider">

    <!-- Apple Podcasts Embed (à mettre à jour avec votre ID Apple Podcasts) -->
    <!-- Remplacez ID_PODCAST par votre identifiant Apple Podcasts -->
    <iframe class="apple-embed"
      src="https://embed.podcasts.apple.com/fr/podcast/l-actualité-du-freinage/idPLACER_VOTRE_ID_Ici"
      height="450"
      frameborder="0"
      sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
      allow="autoplay *; encrypted-media *; clipboard-write"
      title="L'actualité du Freinage sur Apple Podcasts"
      style="display: none;">
    </iframe>
    <!-- Fin Apple Podcasts Embed -->

    <!-- Liste des épisodes -->
    <hr class="divider">
    <h2 style="color: #fff; font-size: 1.1rem; margin-bottom: 1rem;">🎙️ Derniers épisodes</h2>
    <div id="episodes-list" style="text-align: left; margin-bottom: 1.5rem;">
      <p style="color: #8b8fa8; font-size: 0.9rem;">Chargement des épisodes...</p>
    </div>

  </div>

  <script>
  async function loadEpisodes() {
    try {
      const response = await fetch('podcast.xml');
      const text = await response.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(text, 'text/xml');
      const items = xmlDoc.querySelectorAll('item');

      const episodesList = document.getElementById('episodes-list');

      if (items.length === 0) {
        episodesList.innerHTML = '<p style="color: #8b8fa8; font-size: 0.9rem;">Aucun épisode disponible pour le moment.</p>';
        return;
      }

      let html = '';
      items.forEach((item) => {
        const title = item.querySelector('title')?.textContent || 'Épisode sans titre';
        const pubDate = item.querySelector('pubDate')?.textContent || '';
        const description = item.querySelector('description')?.textContent || '';
        const enclosure = item.querySelector('enclosure');
        const audioUrl = enclosure?.getAttribute('url') || '';
        const duration = item.querySelector('duration')?.textContent || '';

        const dateObj = new Date(pubDate);
        const dateStr = dateObj.toLocaleDateString('fr-FR', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });

        let durationStr = '';
        if (duration) {
          const [h, m, s] = duration.split(':').map(Number);
          durationStr = h > 0 ? `${h}h ${m}min` : `${m}min`;
        }

        const cleanDesc = description.replace(/<!\[CDATA\[|\]\]>/g, '');

        html += `
        <div style="margin-bottom: 1.25rem; padding: 1rem; background: #252836; border-radius: 8px; border: 1px solid #333646;">
          <div style="display: flex; gap: 1rem;">
            <span style="font-size: 1.5rem;">🎙️</span>
            <div style="flex: 1;">
              <h3 style="color: #fff; font-size: 1rem; margin-bottom: 0.4rem;">${title}</h3>
              <p style="color: #8b8fa8; font-size: 0.85rem; margin-bottom: 0.5rem;">
                <span>📅 ${dateStr}</span>
                ${durationStr ? `<span style="margin-left: 1rem;">⏱️ ${durationStr}</span>` : ''}
              </p>
              <p style="color: #a0a5b5; font-size: 0.85rem; line-height: 1.5;">${cleanDesc}</p>
              ${audioUrl ? `<a href="${audioUrl}" download style="display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; padding: 0.4rem 0.8rem; background: #1a1d27; border: 1px solid #333646; border-radius: 6px; color: #4ade80; font-size: 0.8rem; text-decoration: none;">
                <span>📥</span><span>Télécharger</span>
              </a>` : ''}
            </div>
          </div>
        </div>
      `;
      });

      episodesList.innerHTML = html;
    } catch (error) {
      document.getElementById('episodes-list').innerHTML = `
      <p style="color: #ff6b6b; font-size: 0.9rem;">⚠️ Impossible de charger les épisodes</p>
    `;
    }
  }

  document.addEventListener('DOMContentLoaded', loadEpisodes);
  </script>

  <div class="footer">
    <a href="podcast.xml" class="rss-link">
      <svg class="rss-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3a1 1 0 0 0 0 2c8.837 0 16 7.163 16 16a1 1 0 1 0 2 0C21 11.058 12.942 3 3 3zm0 6a1 1 0 0 0 0 2c5.514 0 10 4.486 10 10a1 1 0 1 0 2 0c0-6.617-5.383-12-12-12zm1 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
      </svg>
      Flux RSS Podcast <span class="badge">LIVE</span>
    </a>
    <span>© Botiran — L'actualité du Freinage</span>
  </div>
</body>
</html>
